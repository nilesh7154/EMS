# Server Configuration
server.port=${PORT:8085}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employee_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# Note: For production environments, use database migration tools such as Flyway or Liquibase with ddl-auto=validate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# CORS Allowed Origins (comma-separated if multiple)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Application Logging
logging.level.com.example.employeemanagement=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
